<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Búfalo</title><style> *{box-sizing:border-box}body{margin:0;background:#f3f2ed;color:#25372d;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}main{background:white;padding:40px;border-radius:20px;width:min(100%,420px);box-shadow:0 20px 70px #25372d12}small{letter-spacing:3px}h1{font-size:30px;margin-bottom:8px}p{color:#637068;line-height:1.5}label{display:block;margin-top:28px;font-weight:600}input,button{width:100%;padding:14px;border-radius:8px;font:inherit;margin-top:10px}input{border:1px solid #b6c0b9}button{background:#25372d;color:white;border:0;cursor:pointer}a{color:inherit}#error{color:#a83232}</style></head><body><main><small>BÚFALO GROWLER</small><h1>Bem-vindo ao painel.</h1><p>Entre para gerenciar seus banners e acompanhar os resultados do site.</p><form><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button>Entrar no painel</button><p id="error" role="alert"></p></form><a href="/">← Voltar ao site</a></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('button'),error=document.querySelector('#error');btn.disabled=true;error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(!r.ok)throw new Error((await r.json()).error);location.href='/admin';}catch(err){error.textContent=err.message||'Não foi possível entrar.'}finally{btn.disabled=false}};</script></body></html>
