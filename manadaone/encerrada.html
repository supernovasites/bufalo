<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Uma mensagem especial para quem pertence à Manada One.">
<title>Manada One · Até o próximo encontro</title>
<style>
:root{color-scheme:light;--ink:#142e32;--orange:#ff9b52;--paper:#f3f4f2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px clamp(22px,6vw,80px);background:#fff;border-bottom:1px solid #dce0df}
.brand{font-size:22px;line-height:1.4;font-weight:800;letter-spacing:3px;color:inherit;text-decoration:none}.brand small{display:block;font-size:9px;letter-spacing:4px}.tag{font-size:10px;letter-spacing:2px;font-weight:700}
main{max-width:1120px;margin:auto;padding:clamp(28px,6vw,72px) 24px}
.message{background:var(--ink);color:#fff;padding:clamp(28px,5vw,64px);border-radius:2px}
.eyebrow{color:var(--orange);font-size:12px;letter-spacing:2px;font-weight:700;margin:0 0 24px}
h1{max-width:780px;font-size:clamp(28px,4.2vw,52px);line-height:1.15;letter-spacing:-1px;margin:0 0 28px}
.copy{font-size:clamp(15px,1.8vw,19px);color:#d3dedd;margin:0 0 30px;max-width:720px}
.farewell{display:block;color:var(--orange);font-size:clamp(22px,2.6vw,30px);line-height:1.3}
footer{max-width:1120px;margin:auto;padding:0 24px 32px;font-size:12px;color:#617273}
a:focus-visible{outline:3px solid var(--orange);outline-offset:5px}
@media(max-width:480px){.top{padding:16px 20px}.tag{font-size:9px;letter-spacing:1px}main{padding:24px 16px}.message{padding:28px 24px}.eyebrow{font-size:10px;letter-spacing:1.5px}h1{font-size:28px}.copy{font-size:15px}footer{padding:0 16px 24px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="https://bufalogrowler.com.br/" target="_blank" rel="noopener">BÚFALO<small>GROWLER</small></a><span class="tag">MANADA ONE</span></header>
<main><section class="message" aria-labelledby="recognition-title">
<p class="eyebrow">GRUPO SELETO DE CLIENTES</p>
<h1 id="recognition-title">O mais alto nível de reconhecimento da Búfalo.</h1>
<p class="copy">Uma mensagem especial para quem pertence à Manada One.</p>
<strong class="farewell">Até o próximo encontro.</strong>
</section></main>
<footer>BÚFALO GROWLER · Uma companhia para cada aventura.</footer>
</body>
</html>
