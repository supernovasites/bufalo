<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administração · Manada One</title>
  <link rel="stylesheet" href="/manadaone/admin/admin.css">
  <script src="/manadaone/admin/admin.js" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <a class="brand" href="/manadaone/">BÚFALO <span>GROWLER</span></a>
      <span class="label">Administração · Manada One</span>
    </header>
    <section id="login" class="card">
      <p class="eyebrow">ACESSO RESTRITO</p>
      <h1>Controle da Manada One</h1>
      <p>Entre para controlar a disponibilidade da página para os clientes selecionados.</p>
      <form id="login-form">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar no painel <span>↗</span></button>
      </form>
    </section>
    <section id="panel" class="card" hidden>
      <p class="eyebrow">STATUS DA PÁGINA</p>
      <div class="status-row">
        <div>
          <h1 id="title">Manada One</h1>
          <p id="description"></p>
        </div>
        <span id="status" class="status"></span>
      </div>
      <div class="controls">
        <button id="toggle" type="button">Alterar status</button>
        <a href="/manadaone/" target="_blank" rel="noopener">Abrir página ↗</a>
      </div>
      <p id="feedback" role="status" aria-live="polite"></p>
      <button id="logout" class="logout" type="button">Sair do painel</button>
    </section>
  </main>
</body>
</html>
