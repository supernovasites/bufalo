<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administração do blog — Búfalo</title><link rel="stylesheet" href="/blog/blog.css"></head><body><header class="blog-top"><div class="blog-shell blog-top-inner"><a class="blog-brand" href="/">BÚFALO<span>.</span></a><nav class="blog-nav"><a href="/blog/">Ver blog</a></nav></div></header><main class="admin-main"><p class="eyebrow">PAINEL BÚFALO</p><h1>Administração do blog</h1><p class="admin-intro">Crie, revise e publique histórias. Posts em rascunho ficam fora do blog e da página inicial.</p><section id="login-panel" class="admin-card admin-login"><h2>Entrar</h2><form id="login-form"><label class="field"><span>Senha</span><input id="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Entrar no painel</button><p class="status" id="login-status" role="status"></p></form></section><div id="editor-panel" class="admin-layout hidden"><section class="admin-card"><h2 id="editor-title">Novo post</h2><form id="post-form"><input type="hidden" name="id"><label class="field"><span>Título</span><input name="title" maxlength="120" required></label><div class="form-row"><label class="field"><span>Categoria</span><input name="category" maxlength="40" placeholder="Vida lá fora" required></label><label class="field"><span>Data</span><input name="date" type="date" required></label></div><label class="field"><span>Resumo</span><textarea class="short" name="excerpt" maxlength="260" required></textarea></label><label class="field"><span>Imagem de capa</span><input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp"><small class="field-hint">Escolha uma imagem JPG, PNG ou WebP. Ela será ajustada automaticamente para o site.</small></label><input name="image" type="hidden" required><img id="cover-preview" class="cover-preview hidden" alt="Prévia da imagem de capa"><label class="field"><span>Descrição da imagem</span><input name="imageAlt" maxlength="160" required></label><label class="field"><span>Link do artigo original (opcional)</span><input name="sourceUrl" type="url" placeholder="https://loja.bufalogrowler.com.br/pagina/..."></label><label class="field"><span>Texto do artigo (separe parágrafos com linha em branco)</span><textarea name="body" minlength="80" required></textarea></label><label class="field"><span>Status</span><select name="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select></label><div class="admin-actions"><button class="button" type="submit">Salvar post</button><button class="button secondary" type="button" id="new-post">Novo</button><button class="button secondary" type="button" id="logout">Sair</button></div><p class="status" id="save-status" role="status"></p></form></section><aside class="admin-card"><h2>Posts</h2><ul id="admin-posts" class="admin-list"></ul><p id="preview-note" class="preview-note hidden">Prévia local: alterações ficam neste navegador. A publicação futura usará o banco do site.</p></aside></div></main><script type="module" src="/blog/admin/admin.js"></script></body></html>
