<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administração do blog — Búfalo</title><link rel="stylesheet" href="/blog/blog.css"></head><body><header class="blog-top"><div class="blog-shell blog-top-inner"><a class="blog-brand" href="/">BÚFALO<span>.</span></a><nav class="blog-nav"><a href="/blog/">Ver blog</a></nav></div></header><main class="admin-main"><p class="eyebrow">PAINEL BÚFALO</p><h1>Administração do blog</h1><p class="admin-intro">Crie, revise e publique histórias. Posts em rascunho ficam fora do blog e da página inicial.</p><section id="login-panel" class="admin-card admin-login"><h2>Entrar</h2><form id="login-form"><label class="field"><span>Senha</span><input id="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Entrar no painel</button><p class="status" id="login-status" role="status"></p></form></section><div id="editor-panel" class="admin-layout hidden"><section class="admin-card"><h2 id="editor-title">Novo post</h2><form id="post-form"><input type="hidden" name="id"><label class="field"><span>Título</span><input name="title" maxlength="120" required></label><div class="form-row"><label class="field"><span>Categoria</span><input name="category" maxlength="40" placeholder="Vida lá fora" required></label><label class="field"><span>Data</span><input name="date" type="date" required></label></div><label class="field"><span>Resumo</span><textarea class="short" name="excerpt" maxlength="260" required></textarea></label><label class="field"><span>Imagem de capa</span><input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp"><small class="field-hint">Escolha uma imagem JPG, PNG ou WebP. Ela será ajustada automaticamente para o site.</small></label><input name="image" type="hidden" required><img id="cover-preview" class="cover-preview hidden" alt="Prévia da imagem de capa"><label class="field"><span>Descrição da imagem</span><input name="imageAlt" maxlength="160" required></label><label class="field"><span>Link do artigo original (opcional)</span><input name="sourceUrl" type="url" placeholder="https://loja.bufalogrowler.com.br/pagina/..."></label><label class="field"><span>Texto do artigo (separe parágrafos com linha em branco)</span><textarea name="body" minlength="80" required></textarea></label><label class="field"><span>Status</span><select name="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select></label><div class="admin-actions"><button class="button" type="submit">Salvar post</button><button class="button secondary" type="button" id="new-post">Novo</button><button class="button secondary" type="button" id="logout">Sair</button></div><p class="status" id="save-status" role="status"></p></form></section><aside class="admin-card"><h2>Posts</h2><ul id="admin-posts" class="admin-list"></ul><p id="preview-note" class="preview-note hidden">Prévia local: alterações ficam neste navegador. A publicação futura usará o banco do site.</p></aside></div></main><script type="module" src="/blog/admin/admin.js?v=2"></script></body></html>

<script>(()=>{const s=document.createElement('style');s.textContent='.panel-return{position:relative;margin-left:auto}.panel-return summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid currentColor;border-radius:999px;font:inherit;font-weight:700}.panel-return summary::-webkit-details-marker{display:none}.panel-return summary:after{content:"⌄"}.panel-return a{position:absolute;right:0;top:calc(100% + 8px);z-index:30;display:block;white-space:nowrap;padding:10px 14px;border:1px solid #cfd8d4;border-radius:8px;background:#fff;color:#142e32;box-shadow:0 10px 24px #142e3226;text-decoration:none;font-weight:700}.panel-return a:hover{background:#eef3f0}';document.head.append(s);document.querySelector('.back-link')?.remove();const host=document.querySelector('.top,.blog-top-inner');if(!host||host.querySelector('.panel-return'))return;const d=document.createElement('details');d.className='panel-return';d.innerHTML='<summary>Voltar ao Painel</summary><a href="/painel/">Abrir Painel ↗</a>';host.append(d)})();</script>

<script>(()=>{const menu=document.querySelector('.panel-return');if(!menu)return;const style=document.createElement('style');style.textContent='.panel-return.panel-return-floating{position:fixed!important;left:20px;bottom:20px;margin:0;z-index:9999;opacity:.3;transition:opacity .2s ease}.panel-return.panel-return-floating:hover,.panel-return.panel-return-floating:focus-within,.panel-return.panel-return-floating[open]{opacity:.95}.panel-return.panel-return-floating summary{background:#fff;color:#142e32;box-shadow:0 8px 20px #142e3230}.panel-return.panel-return-floating a{top:auto;right:auto;left:0;bottom:calc(100% + 8px)}';document.head.append(style);document.body.append(menu);menu.classList.add('panel-return-floating');const login=document.querySelector('#login,#login-panel');const sync=()=>{const logged=login&&(login.hidden||login.classList.contains('hidden'));menu.hidden=!logged};sync();if(login)new MutationObserver(sync).observe(login,{attributes:true,attributeFilter:['hidden','class']})})();</script>
