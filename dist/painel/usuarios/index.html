<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Usuários · Búfalo</title><link rel="stylesheet" href="/live/admin.css"><link rel="stylesheet" href="/retorno/retorno.css?v=20261109-user-management"><script defer src="/painel/usuarios/usuarios.js?v=20261109-user-management"></script></head><body><header class="top"><a class="wordmark" href="/retorno/">BÚFALO<small>GROWLER</small></a><a id="panel-link" href="/painel/" class="btn light" hidden>Painel administrativo</a></header><main class="shell user-management"><div class="eyebrow">GESTÃO DA EQUIPE</div><h1>Usuários.</h1><p class="intro">Cadastre colaboradores para atender os clientes em Retorno. Somente administradores podem gerenciar estes acessos.</p><section class="card user-form-card"><h2 id="form-title">Cadastrar colaborador</h2><form id="user-form"><input id="user-id" type="hidden"><label for="name">Nome do funcionário</label><input id="name" required maxlength="100"><label for="username">Usuário</label><input id="username" required pattern="[a-zA-Z0-9._-]{3,64}" maxlength="64" autocomplete="off"><p>A senha inicial é sempre <strong>1234</strong>. O colaborador deverá alterá-la no primeiro acesso.</p><div class="toolbar"><button class="btn" type="submit">Salvar colaborador</button><button class="btn light" id="cancel" type="button">Limpar formulário</button></div></form></section><p id="feedback" role="status" aria-live="polite"></p><section class="card"><div class="toolbar user-list-heading"><h2>Colaboradores</h2><span id="user-count" class="badge"></span></div><div id="users"></div></section></main></body></html>
